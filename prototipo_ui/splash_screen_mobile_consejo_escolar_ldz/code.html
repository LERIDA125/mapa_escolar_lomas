<!DOCTYPE html>

<html class="h-full" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport"/>
<title>Splash Screen - Consejo Escolar LDZ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#0b2545',
              dark: '#133b68',
              blue: '#1976d2',
              cyan: '#0284c7',
              sky: '#38bdf8',
              lightSky: '#e0f2fe',
              ice: '#f0f9ff'
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'spin-slow': 'spin 1.8s linear infinite',
            'float': 'float 4s ease-in-out infinite',
            'shimmer': 'shimmer 2.5s infinite linear',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-6px)' },
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            }
          }
        }
      }
    }
  </script>
<style>
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    .ambient-glow {
      animation: subtlePulse 6s ease-in-out infinite;
    }
    .badge-backdrop {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="min-h-screen w-full bg-gradient-to-b from-[#071a30] via-[#0d2a4d] to-[#041224] text-white font-sans antialiased select-none flex flex-col justify-between relative overflow-hidden"><!-- Subtle Background Vector Pattern & Glows -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-24 -left-24 w-80 h-80 bg-sky-500/20 rounded-full blur-3xl ambient-glow"></div>
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-brand-sky/15 rounded-full blur-[80px] ambient-glow" style="animation-delay: 2s;"></div>
<div class="absolute -bottom-20 -right-20 w-80 h-80 bg-blue-600/20 rounded-full blur-3xl ambient-glow" style="animation-delay: 3s;"></div>
<svg class="absolute inset-0 w-full h-full opacity-[0.06]" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="white" stroke-width="1"></path>
<circle cx="0" cy="0" fill="white" r="1.5"></circle>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
<div class="absolute -top-40 -right-40 w-96 h-96 border border-cyan-400/10 rounded-full"></div>
<div class="absolute -top-20 -right-20 w-72 h-72 border border-sky-300/10 rounded-full"></div>
</div>
<!-- Top Status / Jurisdiction Micro-Header -->
<header class="relative z-10 w-full pt-8 px-6 flex items-center justify-between text-sky-200/80">
<div class="flex items-center space-x-2">
<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
<span class="text-[11px] font-semibold tracking-wider uppercase text-sky-200/90">Lomas de Zamora</span>
</div>
<div class="flex items-center space-x-1 bg-white/10 px-2.5 py-1 rounded-full text-[10px] font-medium tracking-wide text-sky-100 backdrop-blur-md border border-white/10">
<span class="material-symbols-outlined text-[13px] text-sky-300">wifi_off</span>
<span>MODO OFFLINE</span>
</div>
</header>
<!-- Center Content: Crest, Brand & Typography -->
<main class="relative z-10 flex flex-col items-center justify-center px-6 text-center my-auto w-full">
<!-- Logo Card with Glow -->
<div class="relative mb-6 animate-float w-full max-w-[320px] flex justify-center">
<div class="absolute inset-0 bg-sky-400/20 rounded-2xl blur-xl transform scale-105 pointer-events-none"></div>
<div class="relative w-full rounded-2xl p-[2px] bg-gradient-to-tr from-sky-400/50 via-white/50 to-blue-500/40 shadow-2xl">
<div class="w-full rounded-[14px] bg-white/95 backdrop-blur-md px-4 py-3 flex items-center justify-center border border-white/40 shadow-inner overflow-hidden">
<img alt="Consejo Escolar Lomas de Zamora - Logo Oficial" class="w-full h-auto max-h-[72px] object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/AEtjO1WK6TQU1R5N_Okv0K4gFzBWZUiPctj6rkb0nW09_7o6WmYtEOMYwqFR9wGSqxByhcd48Nd6E6EUwp0CHn8XD6-vNzIlvJyfXd8Qf1I5-ok6JxpLHaxipZz7DLJnvwEWxhK4wSyeDDBOraC-Au-IFuBmD0K7gz_j1JxnNMb9MXKA0bS4KZNl8ye-ghYHLrn6f0Old1-KRq3USygnRZKQuJh2G8HsrsbWyfn7Gf3Bfomy"/>
</div>
</div>
</div>
<!-- Main Headline Typography -->
<div class="space-y-1.5 max-w-[320px]">
<h1 class="text-3xl font-extrabold text-white tracking-tight drop-shadow-sm">
      Consejo Escolar
    </h1>
<p class="text-base font-medium text-sky-200/90 tracking-normal">
      Sector Auxiliares
    </p>
<div class="pt-2 flex items-center justify-center space-x-2">
<span class="h-[1px] w-6 bg-gradient-to-r from-transparent to-sky-400/50"></span>
<span class="text-[11px] font-medium tracking-wide text-sky-300/80 uppercase">
        Actos Públicos • Guía de Escuelas
      </span>
<span class="h-[1px] w-6 bg-gradient-to-l from-transparent to-sky-400/50"></span>
</div>
</div>
<!-- Quick Feature Pill -->
<div class="mt-6 inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white/[0.07] border border-white/10 text-[12px] text-sky-100 shadow-sm">
<span class="material-symbols-outlined text-sky-300 text-[16px]">map</span>
<span>Geolocalización y Ruteo Inmediato</span>
</div>
</main>
<!-- Bottom Section: Loading Indicator & Offline Prep status -->
<footer class="relative z-10 pb-8 px-6 w-full flex flex-col items-center text-center">
<!-- Circular Spinner & Progress details -->
<div class="flex flex-col items-center space-y-3 mb-3">
<div class="relative w-9 h-9">
<div class="absolute inset-0 rounded-full border-2 border-sky-400/20"></div>
<div class="absolute inset-0 rounded-full border-2 border-transparent border-t-sky-400 border-r-sky-300 animate-spin"></div>
<div class="absolute inset-2 rounded-full bg-sky-400/10"></div>
</div>
<div class="space-y-0.5">
<p class="text-[13px] font-medium text-white/95">
        Preparando datos offline...
      </p>
<p class="text-[11px] text-sky-300/70 font-normal">
        Cargando mapa de establecimientos y recorridos
      </p>
</div>
</div>
<!-- Data version info footer -->
<div class="mt-4 pt-3 border-t border-white/5 w-full flex items-center justify-between text-[10px] text-sky-200/50 px-2">
<span>Distrito Lomas de Zamora (062)</span>
<span>v2.4.0 • Base Local</span>
</div>
</footer></body></html>
